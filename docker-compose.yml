services:
  # 1. Base de Datos MySQL
  mysql:
    image: mysql:8.0
    container_name: subastaya-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: SubastaYaDb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # 2. Backend API (.NET 8)
  backend:
    build:
      context: .
      dockerfile: SubastaYa.Api/Dockerfile
    container_name: subastaya-backend
    restart: always
    ports:
      - "5110:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=SubastaYaDb;User=root;Password=root;
      - Jwt__Key=EstaEsUnaClaveSecretaMuyLargaParaJWT123456789!
      - Jwt__Issuer=SubastaYaApi
      - Jwt__Audience=SubastaYaFrontend
    depends_on:
      mysql:
        condition: service_healthy

  # 3. Frontend Web (React + Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: subastaya-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
